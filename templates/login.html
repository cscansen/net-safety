<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<title>Parent Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #f0f4ff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 32px rgba(0,0,0,.08);
  }
  .icon { font-size: 56px; margin-bottom: 12px; }
  h1 { font-size: 22px; color: #1a1a2e; margin-bottom: 6px; }
  .sub { color: #777; font-size: 14px; margin-bottom: 28px; }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    transition: border-color .2s;
    margin-bottom: 16px;
  }
  input[type=text]:focus, input[type=password]:focus { border-color: #1a73e8; }
  button {
    width: 100%;
    padding: 13px;
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  button:hover { background: #155db2; }
  .error {
    background: #fde8e8;
    color: #c0392b;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    margin-bottom: 16px;
  }

  @media (prefers-color-scheme: dark) {
    body  { background: #0f1117; }
    .card { background: #1a1d2e; box-shadow: 0 4px 32px rgba(0,0,0,.4); }
    h1    { color: #e8eaf6; }
    .sub  { color: #9e9eb0; }
    input[type=text], input[type=password] {
      background: #0f1117; border-color: #3a3d52; color: #e8eaf6;
    }
    input[type=text]:focus, input[type=password]:focus { border-color: #4a8de8; }
    .error { background: #2a1515; color: #e57373; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔒</div>
  <h1>Parent Review</h1>
  <p class="sub">Sign in to review and approve sites</p>
  <form method="post" action="/login" autocomplete="off">
    {% if error %}
    <div class="error">Incorrect username or password.</div>
    {% endif %}
    <input type="text" name="username" placeholder="Username"
           autofocus autocomplete="username">
    <input type="password" name="password" placeholder="Password"
           autocomplete="current-password">
    <button type="submit">Unlock</button>
  </form>
</div>
</body>
</html>
